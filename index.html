<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>サロン予約台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app — sticky date header, 15-min timeline with proportional booking blocks, bottom tab bar, bottom-sheet modals */
:root{
  --bg:#f6f3f2; --surface:#ffffff; --sunk:#efeae8; --line:#e2dad7; --line-soft:#ece6e4;
  --fg:#2b2226; --muted:#7d6f74; --accent:#8a3f63; --accent-fg:#ffffff; --accent-soft:#f3e4ec;
  --f-bg:#f9c9d8; --f-fg:#5e1f37; --f-edge:#e889a8;
  --m-bg:#cfe3f6; --m-fg:#1d3d5c; --m-edge:#8bb6de;
  --n-bg:#d3eed2; --n-fg:#1f4a26; --n-edge:#8fcb8f;
  --o-bg:#e8e1df; --o-fg:#3d3336; --o-edge:#c3b6b2;
  --warn:#b4541a; --warn-soft:#fbeadf; --danger:#b3303f;
  --now:#d2475f;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --row:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1619; --surface:#251f22; --sunk:#2d2629; --line:#3a3236; --line-soft:#2f282b;
  --fg:#f1e9ec; --muted:#a8999f; --accent:#e59bbd; --accent-fg:#2a1520; --accent-soft:#3b2530;
  --f-bg:#5a2a3b; --f-fg:#ffdbe7; --f-edge:#c4668a;
  --m-bg:#22394f; --m-fg:#d7e9fb; --m-edge:#5d8fbd;
  --n-bg:#244028; --n-fg:#d7f3d6; --n-edge:#62a868;
  --o-bg:#3a3235; --o-fg:#ece2e5; --o-edge:#6f6267;
  --warn:#f0a36d; --warn-soft:#3d2a1d; --danger:#f17b88; --now:#ff6f86;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1619; --surface:#251f22; --sunk:#2d2629; --line:#3a3236; --line-soft:#2f282b;
  --fg:#f1e9ec; --muted:#a8999f; --accent:#e59bbd; --accent-fg:#2a1520; --accent-soft:#3b2530;
  --f-bg:#5a2a3b; --f-fg:#ffdbe7; --f-edge:#c4668a;
  --m-bg:#22394f; --m-fg:#d7e9fb; --m-edge:#5d8fbd;
  --n-bg:#244028; --n-fg:#d7f3d6; --n-edge:#62a868;
  --o-bg:#3a3235; --o-fg:#ece2e5; --o-edge:#6f6267;
  --warn:#f0a36d; --warn-soft:#3d2a1d; --danger:#f17b88; --now:#ff6f86;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.datebar{display:flex;align-items:center;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.datebox{flex:1;min-width:0;text-align:center;border:0;background:none;padding:2px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.datebox:hover{background:var(--accent-soft)}
.datebox .d{font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.02em}
.datebox .y{font-size:11px;color:var(--muted);letter-spacing:.08em}
.datebox .caret{font-size:10px;color:var(--accent);margin-top:-2px}
/* month calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;font-weight:500}
.cal .wd.sun,.cal .day.sun .dn{color:var(--danger)}
.cal .wd.sat,.cal .day.sat .dn{color:#3b6fa8}
.cal .day{aspect-ratio:1/1.15;max-width:100%;border:1px solid var(--line-soft);background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px 3px;gap:2px;min-width:0}
.cal .day.out{opacity:.38}
.cal .day .dn{font-family:var(--font-mono);font-size:14px;font-variant-numeric:tabular-nums}
.cal .day .cnt{font-size:11px;font-weight:700;color:var(--accent);line-height:1}
.cal .day .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.cal .day .dots i{width:6px;height:6px;border-radius:50%;display:block}
.cal .day .dots i.f{background:var(--f-edge)}.cal .day .dots i.m{background:var(--m-edge)}.cal .day .dots i.n{background:var(--n-edge)}.cal .day .dots i.o{background:var(--o-edge)}
.cal .day.today{border-color:var(--accent)}
.cal .day.sel{background:var(--accent);border-color:var(--accent)}
.cal .day.sel .dn,.cal .day.sel .cnt{color:var(--accent-fg)}
.calfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.todaybtn{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;flex:none}
.todaybtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.summary{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;align-items:center}
.summary b{color:var(--fg);font-size:14px;margin-left:3px}
.legend{display:flex;gap:10px;margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid}
.dot.f{background:var(--f-bg);border-color:var(--f-edge)} .dot.m{background:var(--m-bg);border-color:var(--m-edge)} .dot.n{background:var(--n-bg);border-color:var(--n-edge)}

/* timeline */
.view{padding:12px 16px 0}
.timeline{position:relative;display:grid;grid-template-columns:48px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.times{border-right:1px solid var(--line)}
.tlabel{height:var(--row);font-size:11px;color:var(--muted);text-align:right;padding-right:6px;line-height:1;padding-top:3px}
.tlabel.h{color:var(--fg);font-weight:500}
.lane{position:relative}
.slot{height:var(--row);border-bottom:1px solid var(--line-soft);width:100%;display:block;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;padding:0 8px;font-size:11px;color:transparent}
.slot.h{border-bottom-color:var(--line-soft)}
.slot.hr{border-top:0}
.slot:nth-child(4n){border-bottom-color:var(--line)}
.slot:hover,.slot:focus-visible{background:var(--accent-soft);color:var(--accent)}
.bk{position:absolute;border-radius:9px;border:1px solid;border-left-width:4px;padding:3px 7px;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:0;font-size:12px;line-height:1.3;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.bk.f{background:var(--f-bg);color:var(--f-fg);border-color:var(--f-edge)}
.bk.m{background:var(--m-bg);color:var(--m-fg);border-color:var(--m-edge)}
.bk.n{background:var(--n-bg);color:var(--n-fg);border-color:var(--n-edge)}
.bk.o{background:var(--o-bg);color:var(--o-fg);border-color:var(--o-edge)}
.bk .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:0 5px;border-radius:5px;margin-left:4px;vertical-align:1px;background:rgba(255,255,255,.55)}
:root[data-theme="dark"] .tag{background:rgba(0,0,0,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{background:rgba(0,0,0,.25)}}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:5;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.empty{margin:10px 0 0;font-size:13px;color:var(--muted);text-align:center}

.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(80,20,50,.25)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
/* analysis */
.monthbar{display:flex;align-items:center;gap:8px;justify-content:center}
.monthbar .m{font-family:var(--font-display);font-weight:700;font-size:19px;min-width:9em;text-align:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:22px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi .s .up{color:#2f7d45}.kpi .s .down{color:var(--danger)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:12px;color:var(--muted);font-weight:500}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line)}
.tbl .num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px}
.tab{height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);font-weight:500}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}

/* generic */
h2{font-family:var(--font-display);font-size:19px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.lbl{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.inp{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
textarea.inp{height:auto;min-height:64px;padding:10px 12px;resize:vertical}
.btn{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:transparent}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:40px;border:0;background:var(--surface);font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(30,15,22,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet-h h2{flex:1;min-width:0}
.sheet-b{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:16px}
.sheet-f{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-f .btn{flex:1}
.sheet-f .btn.danger{flex:0 0 auto}

.cust-chip{display:flex;align-items:center;gap:10px;padding:10px 12px}
.cust-chip .nm{font-weight:700;font-size:16px}
.cust-chip .sub{font-size:12px;color:var(--muted)}
.cust-chip .grow{flex:1;min-width:0}
.results{display:flex;flex-direction:column}
.res{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;width:100%}
.res:last-child{border-bottom:0}
.res .grow{flex:1;min-width:0}
.res .sub{font-size:12px;color:var(--muted)}
.gbadge{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:1px solid}
.gbadge.f{background:var(--f-bg);color:var(--f-fg);border-color:var(--f-edge)}
.gbadge.m{background:var(--m-bg);color:var(--m-fg);border-color:var(--m-edge)}
.gbadge.o{background:var(--o-bg);color:var(--o-fg);border-color:var(--o-edge)}

.menus{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:46px;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border-bottom:0}
.mrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.mrow .grow{flex:1;min-width:0}
.mrow .mins{font-size:13px;color:var(--muted)}
.calc{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13px}
.calc b{font-size:17px}
.warn{padding:9px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yen{position:relative}
.yen span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.yen .inp{padding-left:28px}
.err{color:var(--danger);font-size:13px}

/* customers view */
.search{position:relative}
.search .inp{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.clist{margin-top:12px}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-soft);font-size:13px;align-items:baseline}
.hrow:last-child{border-bottom:0}
.hrow .grow{min-width:0}
.hrow .memo{color:var(--muted);font-size:12px}
.stats{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.stats b{color:var(--fg);font-size:15px;margin-left:3px}

/* settings */
.set-sec{display:flex;flex-direction:column;gap:8px}
.set-sec .lbl{padding:0 2px}
.srow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.srow:last-child{border-bottom:0}
.srow .inp{height:40px;font-size:15px;flex:1;min-width:0}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.step button{width:34px;height:38px;border:0;background:var(--sunk);font-size:16px}
.step span{min-width:52px;text-align:center;font-size:14px}
.xbtn{width:34px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--danger);flex:none}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="app">
  <header class="top" id="top">
    <div class="datebar">
      <button class="iconbtn" id="prev" aria-label="前の日">‹</button>
      <button class="datebox" id="dateOpen" aria-haspopup="dialog" aria-label="カレンダーから日付を選ぶ">
        <span class="y num" id="dYear">2026</span>
        <span class="d" id="dLabel">10月9日（金）</span><span class="caret">▾</span>
      </button>
      <button class="iconbtn" id="next" aria-label="次の日">›</button>
      <button class="todaybtn" id="today">今日</button>
    </div>
    <div class="summary" id="summary">
      <span>予約<b class="num" id="sCount">0</b>件</span>
      <span>売上見込<b class="num" id="sSales">¥0</b></span>
      <span>新規<b class="num" id="sNew">0</b></span>
      <span class="legend"><span><i class="dot f"></i>女性</span><span><i class="dot m"></i>男性</span><span><i class="dot n"></i>新規</span></span>
    </div>
  </header>

  <main>
    <section class="view" id="vSchedule">
      <div class="timeline" id="timeline"></div>
      <p class="empty" id="dayEmpty" hidden>空いている時間をタップすると予約を入れられます</p>
    </section>
    <section class="view" id="vCustomers" hidden></section>
    <section class="view" id="vSettings" hidden></section>
  </main>
  <button class="fab" id="fab">＋ 予約</button>
</div>

<nav class="tabs" role="tablist">
  <div class="in">
    <button class="tab" role="tab" data-tab="schedule" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>スケジュール</button>
    <button class="tab" role="tab" data-tab="customers" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4.1-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>顧客</button>
    <button class="tab" id="tabAnalysis" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>分析</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>設定</button>
  </div>
</nav>

<div id="sheetRoot"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=> (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,20);
const pad=n=>String(n).padStart(2,"0");
const fmtT=m=>`${Math.floor(m/60)}:${pad(m%60)}`;
const parseT=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};
const yen=n=>"¥"+(Number(n)||0).toLocaleString("ja-JP");
const WD=["日","月","火","水","木","金","土"];
const dStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dObj=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const dLabel=s=>{const d=dObj(s);return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`};
const dShort=s=>{const d=dObj(s);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`};
const addDays=(s,n)=>{const d=dObj(s);d.setDate(d.getDate()+n);return dStr(d)};
const todayStr=()=>dStr(new Date());
const gLabel={F:"女",M:"男",O:"他"};
const gClass={F:"f",M:"m",O:"o"};
const kanaKey=c=>(c.kana||c.name||"");

const DEFAULT_SETTINGS={open:"10:00",close:"20:00",menus:[
  {id:"cut",name:"カット",min:60},{id:"color",name:"カラー",min:60},{id:"perm",name:"パーマ",min:90},
  {id:"tr",name:"トリートメント",min:30},{id:"spa",name:"ヘッドスパ",min:30},{id:"mens",name:"メンズカット",min:45},
  {id:"str",name:"縮毛矯正",min:150},{id:"set",name:"ヘアセット",min:45}]};

/* ---------- state ---------- */
const S={mode:"loading",db:null,date:todayStr(),tab:"schedule",settings:structuredClone(DEFAULT_SETTINGS),
  customers:{},day:[],local:null,unsubDay:null,readOnly:false,custQuery:""};

/* ---------- storage layer ---------- */
const LKEY="salon-yoyaku-v1";
function loadLocal(){let o=null;try{o=JSON.parse(localStorage.getItem(LKEY)||"null")}catch(e){}
  S.local=o||{customers:{},bookings:{},settings:null};
  S.customers=S.local.customers; if(S.local.settings)S.settings=S.local.settings; refreshLocalDay();}
function persistLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S.local))}catch(e){}}
function refreshLocalDay(){S.day=Object.values(S.local.bookings).filter(b=>b.date===S.date)}

async function guard(p){try{await p;return true}catch(e){
  if(e&&e.code==="invalid_argument"){toast("この予約表を編集する権限がありません");S.readOnly=true}
  else if(e&&e.code==="quota_exceeded")toast("保存容量の上限に達しました。古い予約を削除してください");
  else toast("保存できませんでした。通信状態を確認してもう一度お試しください");
  return false}}

async function putBooking(b){
  if(S.mode==="db") return guard(S.db.collection("bookings").doc(b.id).set(b));
  S.local.bookings[b.id]=b;persistLocal();refreshLocalDay();renderAll();return true}
async function removeBooking(id){
  if(S.mode==="db") return guard(S.db.collection("bookings").doc(id).delete());
  delete S.local.bookings[id];persistLocal();refreshLocalDay();renderAll();return true}
async function putCustomer(c){
  if(S.mode==="db"){S.customers[c.id]=c;return guard(S.db.collection("customers").doc(c.id).set(c))}
  S.local.customers[c.id]=c;persistLocal();renderAll();return true}
async function removeCustomer(id){
  if(S.mode==="db"){return guard(S.db.collection("customers").doc(id).delete())}
  delete S.local.customers[id];persistLocal();renderAll();return true}
async function putSettings(st){
  if(S.mode==="db") return guard(S.db.doc("settings/main").set(st));
  S.local.settings=st;S.settings=st;persistLocal();renderAll();return true}
async function bookingsOn(date){
  if(date===S.date) return S.day;
  if(S.mode==="db"){try{const q=await S.db.collection("bookings").where("date","==",date).get();return q.docs.map(d=>d.data())}catch(e){return []}}
  return Object.values(S.local.bookings).filter(b=>b.date===date)}
async function historyOf(cid){
  let arr;
  if(S.mode==="db"){try{const q=await S.db.collection("bookings").where("customerId","==",cid).get();arr=q.docs.map(d=>d.data())}catch(e){arr=[]}}
  else arr=Object.values(S.local.bookings).filter(b=>b.customerId===cid);
  return arr.sort((a,b)=>(b.date+pad(b.start)).localeCompare(a.date+pad(a.start)))}

function subscribeDay(){
  if(S.mode!=="db")return;
  if(S.unsubDay)S.unsubDay();
  const date=S.date;
  S.unsubDay=S.db.collection("bookings").where("date","==",date).onSnapshot(snap=>{
    if(date!==S.date)return; S.day=snap.docs.map(d=>d.data()); renderSchedule(); renderSummary();
  },()=>{});
}

/* ---------- derived ---------- */
const bookingDur=b=>Math.max(5,(b.menus||[]).reduce((s,m)=>s+(m.min||0),0)+(b.adjust||0));
function isNew(b){const c=S.customers[b.customerId];return !!(c&&c.firstBookingId===b.id)||(!c&&b.isNewAtSave)}
function colorOf(b){if(isNew(b))return "n";const c=S.customers[b.customerId];return gClass[(c&&c.gender)||b.gender]||"o"}
function custName(b){const c=S.customers[b.customerId];return (c&&c.name)||b.customerName||"（名前なし）"}

/* ---------- render: header ---------- */
function renderHeader(){
  $("#dLabel").textContent=dLabel(S.date);
  $("#dYear").textContent=dObj(S.date).getFullYear()+"年";
  $("#today").setAttribute("aria-pressed",String(S.date===todayStr()));
}
function renderSummary(){
  $("#sCount").textContent=S.day.length;
  $("#sSales").textContent=yen(S.day.reduce((s,b)=>s+(Number(b.price)||0),0));
  $("#sNew").textContent=S.day.filter(isNew).length;
}

/* ---------- render: schedule ---------- */
function renderSchedule(){
  const open=parseT(S.settings.open), close=parseT(S.settings.close);
  const rows=Math.max(1,Math.ceil((close-open)/15));
  const rowH=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row"))||26;
  let t="",l="";
  for(let i=0;i<rows;i++){const m=open+i*15;const hr=m%60===0;
    t+=`<div class="tlabel num ${hr?"h":""}">${hr||i===0?fmtT(m):""}</div>`;
    l+=`<button class="slot num" data-start="${m}" aria-label="${fmtT(m)} に予約を追加">＋ ${fmtT(m)}</button>`}
  // lanes for overlaps
  const items=S.day.map(b=>({b,s:b.start,e:b.start+bookingDur(b)})).sort((a,c)=>a.s-c.s||c.e-a.e);
  let cluster=[],clusterEnd=-1;const out=[];
  const flush=()=>{const lanes=[];cluster.forEach(it=>{let k=lanes.findIndex(e=>e<=it.s);if(k<0){k=lanes.length;lanes.push(0)}lanes[k]=it.e;it.lane=k});
    cluster.forEach(it=>{it.lanes=lanes.length;out.push(it)});cluster=[]};
  items.forEach(it=>{if(cluster.length&&it.s>=clusterEnd){flush();clusterEnd=-1}cluster.push(it);clusterEnd=Math.max(clusterEnd,it.e)});flush();
  let blocks="";
  out.forEach(it=>{const b=it.b;
    const s=Math.max(it.s,open),e=Math.min(Math.max(it.e,s+15),close+60);
    const top=(s-open)/15*rowH+1, h=Math.max(rowH-2,(e-s)/15*rowH-2);
    const w=100/it.lanes, left=`calc(${w*it.lane}% + 4px)`, width=`calc(${w}% - 8px)`;
    const menus=(b.menus||[]).map(m=>m.name).join("＋")||"メニュー未設定";
    const c=S.customers[b.customerId]; const g=gLabel[(c&&c.gender)||b.gender]||"";
    const compact=h<rowH*2.2;
    blocks+=`<button class="bk ${colorOf(b)}" data-id="${esc(b.id)}" style="top:${top}px;height:${h}px;left:${left};width:${width}">
      <span class="nm">${esc(custName(b))} 様${g?`<span class="tag">${g}</span>`:""}${isNew(b)?`<span class="tag">新規</span>`:""}</span>
      <span class="meta num">${fmtT(it.s)}–${fmtT(it.e)}${compact?" ・"+esc(menus):""}</span>
      ${compact?"":`<span class="meta">${esc(menus)}</span>`}
    </button>`});
  let now="";
  if(S.date===todayStr()){const d=new Date();const m=d.getHours()*60+d.getMinutes();
    if(m>=open&&m<=close)now=`<div class="nowline" style="top:${(m-open)/15*rowH}px"></div>`}
  $("#timeline").innerHTML=`<div class="times">${t}</div><div class="lane">${l}${blocks}${now}</div>`;
  $("#dayEmpty").hidden=S.day.length>0;
}

/* ---------- render: customers ---------- */

  const q=S.custQuery.trim().toLowerCase();
  const list=Object.values(S.customers).filter(c=>!q||[c.name,c.kana,c.phone].some(v=>(v||"").toLowerCase().includes(q)))
    .sort((a,b)=>kanaKey(a).localeCompare(kanaKey(b),"ja"));
  const rows=list.map(c=>`<button class="res" data-cid="${esc(c.id)}">
      <span class="gbadge ${gClass[c.gender]||"o"}">${gLabel[c.gender]||"他"}</span>
      <span class="grow"><div><b>${esc(c.name)}</b> <span class="sub">${esc(c.kana||"")}</span></div>
      <div class="sub">${c.lastVisit?`最終来店 ${dShort(c.lastVisit)}　${esc(c.lastMenu||"")}`:"来店記録なし"}</div></span>
      <span class="sub">›</span></button>`).join("");
  $("#vCustomers").innerHTML=`
    <div style="display:flex;gap:8px;align-items:center">
      <div class="search" style="flex:1;min-width:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input class="inp" id="custSearch" placeholder="名前・フリガナ・電話で検索" value="${esc(S.custQuery)}"></div>
      <button class="btn pri" id="custAdd">＋ 新規</button>
    </div>
    <p class="note" style="margin:8px 2px 0">登録 ${Object.keys(S.customers).length} 名</p>
    <div class="card clist results">${rows||`<p class="empty" style="padding:16px">${q?"該当する顧客がいません":"まだ顧客がいません。予約を入れると自動で登録されます"}</p>`}</div>`;
}

  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));

/* ---------- analysis sheet ---------- */
const ymShift=(ym,n)=>{const [y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const ymLabel=ym=>{const [y,m]=ym.split("-").map(Number);return `${y}年${m}月`};
async function monthBookings(ym){
  if(S.mode==="db"){try{const q=await S.db.collection("bookings").where("date",">=",ym+"-01").where("date","<=",ym+"-31").get();return q.docs.map(d=>d.data())}catch(e){return null}}
  if(S.mode==="local")return Object.values(S.local.bookings).filter(b=>b.date.startsWith(ym));
  return [];
}
function statsOf(list){
  const o={n:0,sales:0,newN:0,newSales:0,exN:0,exSales:0};
  list.forEach(b=>{const p=Number(b.price)||0;o.n++;o.sales+=p;if(isNew(b)){o.newN++;o.newSales+=p}else{o.exN++;o.exSales+=p}});
  return o;
}
const avg=(s,n)=>n?Math.round(s/n):0;
function diffTxt(cur,prev,unit){
  if(!prev)return `<span>前月 ${unit==="yen"?yen(0):"0人"}</span>`;
  const r=Math.round((cur-prev)/prev*100);
  return `前月比 <span class="${r>=0?"up":"down"}">${r>=0?"+":""}${r}%</span>`;
}
function openAnalysis(ym){
  const sheet=openSheet(`
    <div class="sheet-h"><h2>売上分析</h2><button class="iconbtn" id="anClose" aria-label="閉じる">×</button></div>
    <div class="sheet-b" id="anBody"></div>`);
  sheet.querySelector("#anClose").onclick=closeSheet;
  const body=sheet.querySelector("#anBody");
  let cur=ym, token=0;
  async function paint(){
    const my=++token;
    body.innerHTML=`<div class="monthbar"><button class="iconbtn" id="anPrev" aria-label="前の月">‹</button><span class="m">${ymLabel(cur)}</span><button class="iconbtn" id="anNext" aria-label="次の月">›</button></div>
      <p class="note" style="text-align:center;margin:0">集計中…</p>`;
    bindNav();
    const [list,prevList]=await Promise.all([monthBookings(cur),monthBookings(ymShift(cur,-1))]);
    if(my!==token)return;
    if(list===null){body.querySelector(".note").textContent="集計できませんでした。通信状態を確認してください";return}
    const s=statsOf(list), p=statsOf(prevList||[]);
    const days={};list.forEach(b=>{(days[b.date]=days[b.date]||[]).push(b)});
    const dayRows=Object.keys(days).sort().map(d=>{const x=statsOf(days[d]);
      return `<tr><td>${dLabel(d)}</td><td class="num">${x.n}</td><td class="num">${x.newN}</td><td class="num">${yen(x.sales)}</td></tr>`}).join("");
    body.innerHTML=`
      <div class="monthbar"><button class="iconbtn" id="anPrev" aria-label="前の月">‹</button><span class="m">${ymLabel(cur)}</span><button class="iconbtn" id="anNext" aria-label="次の月">›</button></div>
      <div class="kpis">
        <div class="card kpi"><span class="k">売上合計</span><span class="v">${yen(s.sales)}</span><span class="s">${diffTxt(s.sales,p.sales,"yen")}</span></div>
        <div class="card kpi"><span class="k">客数</span><span class="v">${s.n}<small style="font-size:14px">人</small></span><span class="s">${diffTxt(s.n,p.n,"n")}</span></div>
        <div class="card kpi"><span class="k">客単価</span><span class="v">${yen(avg(s.sales,s.n))}</span><span class="s">前月 ${yen(avg(p.sales,p.n))}</span></div>
        <div class="card kpi"><span class="k">新規比率</span><span class="v">${s.n?Math.round(s.newN/s.n*100):0}%</span><span class="s">新規 ${s.newN}人 ／ 既存 ${s.exN}人</span></div>
      </div>
      <div class="field"><span class="lbl">新規・既存の内訳</span>
        <div class="card tbl-wrap"><table class="tbl">
          <thead><tr><th>区分</th><th>客数</th><th>売上</th><th>客単価</th></tr></thead>
          <tbody>
            <tr><td><span class="chip"><i class="dot n"></i>新規</span></td><td class="num">${s.newN}人</td><td class="num">${yen(s.newSales)}</td><td class="num">${yen(avg(s.newSales,s.newN))}</td></tr>
            <tr><td><span class="chip"><i class="dot f"></i>既存</span></td><td class="num">${s.exN}人</td><td class="num">${yen(s.exSales)}</td><td class="num">${yen(avg(s.exSales,s.exN))}</td></tr>
          </tbody>
          <tfoot><tr><td>合計</td><td class="num">${s.n}人</td><td class="num">${yen(s.sales)}</td><td class="num">${yen(avg(s.sales,s.n))}</td></tr></tfoot>
        </table></div></div>
      <div class="field"><span class="lbl">日別</span>
        <div class="card tbl-wrap">${dayRows?`<table class="tbl"><thead><tr><th>日付</th><th>客数</th><th>新規</th><th>売上</th></tr></thead><tbody>${dayRows}</tbody></table>`:`<p class="note" style="padding:12px;margin:0">この月の予約はまだありません</p>`}</div></div>
      <p class="note">予約に入力した金額で集計しています。客数は来店（予約）件数です。新規は、そのお客様の初回の予約を数えています。</p>`;
    bindNav();
  }
  function bindNav(){body.querySelector("#anPrev").onclick=()=>{cur=ymShift(cur,-1);paint()};body.querySelector("#anNext").onclick=()=>{cur=ymShift(cur,1);paint()}}
  paint();
}

/* ---------- month calendar sheet ---------- */
function openCalendar(){
  let cur=S.date.slice(0,7), token=0;
  const sheet=openSheet(`
    <div class="sheet-h"><h2>日付を選ぶ</h2><button class="iconbtn" id="calClose" aria-label="閉じる">×</button></div>
    <div class="sheet-b" id="calBody"></div>`);
  sheet.querySelector("#calClose").onclick=closeSheet;
  const body=sheet.querySelector("#calBody");
  function grid(byDay){
    const [y,m]=cur.split("-").map(Number);
    const first=new Date(y,m-1,1), startDow=first.getDay();
    const days=new Date(y,m,0).getDate();
    const cells=Math.ceil((startDow+days)/7)*7;
    const today=todayStr();
    let h=["日","月","火","水","木","金","土"].map((w,i)=>`<div class="wd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("");
    for(let i=0;i<cells;i++){
      const d=new Date(y,m-1,1+i-startDow);const ds=dStr(d);const out=d.getMonth()!==m-1;
      const list=byDay?byDay[ds]||[]:[];
      const dots=list.slice(0,6).map(b=>`<i class="${colorOf(b)}"></i>`).join("");
      const dow=d.getDay();
      h+=`<button class="day ${out?"out":""} ${ds===today?"today":""} ${ds===S.date?"sel":""} ${dow===0?"sun":dow===6?"sat":""}" data-d="${ds}" aria-label="${dLabel(ds)} 予約${list.length}件">
        <span class="dn">${d.getDate()}</span>${list.length?`<span class="cnt num">${list.length}件</span><span class="dots">${dots}</span>`:""}</button>`;
    }
    return h;
  }
  async function paint(){
    const my=++token;
    const head=`<div class="monthbar"><button class="iconbtn" id="calPrev" aria-label="前の月">‹</button><span class="m">${ymLabel(cur)}</span><button class="iconbtn" id="calNext" aria-label="次の月">›</button></div>`;
    const foot=`<div class="calfoot"><span class="legend" style="margin:0;font-size:12px;color:var(--muted)"><span><i class="dot f"></i>女性</span><span><i class="dot m"></i>男性</span><span><i class="dot n"></i>新規</span></span><button class="btn" id="calToday" style="height:38px">今日に戻る</button></div>`;
    body.innerHTML=head+`<div class="cal">${grid(null)}</div>`+foot;bind();
    const [y,m]=cur.split("-").map(Number);
    const prevYm=ymShift(cur,-1), nextYm=ymShift(cur,1);
    const lists=await Promise.all([monthBookings(prevYm),monthBookings(cur),monthBookings(nextYm)]);
    if(my!==token)return;
    const byDay={};lists.forEach(l=>(l||[]).forEach(b=>{(byDay[b.date]=byDay[b.date]||[]).push(b)}));
    Object.values(byDay).forEach(a=>a.sort((p,q)=>p.start-q.start));
    body.querySelector(".cal").innerHTML=grid(byDay);
  }
  function bind(){
    body.querySelector("#calPrev").onclick=()=>{cur=ymShift(cur,-1);paint()};
    body.querySelector("#calNext").onclick=()=>{cur=ymShift(cur,1);paint()};
    body.querySelector("#calToday").onclick=()=>{closeSheet();setDate(todayStr())};
  }
  body.addEventListener("click",e=>{const t=e.target.closest(".day");if(!t)return;closeSheet();setDate(t.dataset.d)});
  paint();
}
let tx=null;$("#vSchedule").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
$("#vSchedule").addEventListener("touchend",e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>80)setDate(addDays(S.date,dx<0?1:-1))});

$("#timeline").addEventListener("click",e=>{
  const bk=e.target.closest(".bk");if(bk){const b=S.day.find(x=>x.id===bk.dataset.id);if(b)openBooking(b);return}
  const sl=e.target.closest(".slot");if(sl)openBooking(null,{start:Number(sl.dataset.start)});
});
$("#fab").onclick=()=>{const open=parseT(S.settings.open);let st=open;
  if(S.date===todayStr()){const d=new Date();st=Math.max(open,Math.ceil((d.getHours()*60+d.getMinutes())/15)*15)}
  openBooking(null,{start:st})};

/* ---------- toast ---------- */
let tt=null;function toast(msg){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.textContent=msg;clearTimeout(tt);tt=setTimeout(()=>el.remove(),2400)}

/* ---------- sheet helper ---------- */
function openSheet(html){const root=$("#sheetRoot");root.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim=root.firstElementChild;scrim.addEventListener("click",e=>{if(e.target===scrim)closeSheet()});return scrim.firstElementChild}
function closeSheet(){$("#sheetRoot").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------- booking sheet ---------- */
function openBooking(existing,preset){
  const st=S.settings;const open=parseT(st.open),close=parseT(st.close);
  const M={
    id:existing?existing.id:uid(), date:existing?existing.date:S.date,
    start:existing?existing.start:(preset&&preset.start!=null?preset.start:open),
    menuIds:new Set(existing?(existing.menus||[]).map(m=>m.id):[]),
    extraMenus:existing?(existing.menus||[]).filter(m=>!st.menus.some(x=>x.id===m.id)):[],
    adjust:existing?existing.adjust||0:0, price:existing?existing.price??"":"", memo:existing?existing.memo||"":"",
    customerId:existing?existing.customerId:(preset&&preset.customerId)||null, newCust:null, q:"", others:null, armed:false
  };
  const sheet=openSheet(`
    <div class="sheet-h"><h2>${existing?"予約の編集":"新規予約"}</h2><button class="iconbtn" id="bkClose" aria-label="閉じる">×</button></div>
    <div class="sheet-b" id="bkBody"></div>
    <div class="sheet-f">${existing?`<button class="btn danger" id="bkDel">削除</button>`:""}<button class="btn" id="bkCancel">キャンセル</button><button class="btn pri" id="bkSave">保存</button></div>`);
  const body=sheet.querySelector("#bkBody");

  const allMenus=()=>[...st.menus,...M.extraMenus];
  const chosen=()=>allMenus().filter(m=>M.menuIds.has(m.id));
  const dur=()=>Math.max(0,chosen().reduce((s,m)=>s+m.min,0)+M.adjust);
  async function loadOthers(){const arr=await bookingsOn(M.date);M.others=arr.filter(b=>b.id!==M.id);paintCalc()}

  function custBlock(){
    if(M.customerId&&S.customers[M.customerId]){const c=S.customers[M.customerId];
      return `<div class="card cust-chip"><span class="gbadge ${gClass[c.gender]||"o"}">${gLabel[c.gender]||"他"}</span>
        <span class="grow"><div class="nm">${esc(c.name)} 様</div><div class="sub">${c.lastVisit?`前回 ${dShort(c.lastVisit)}　${esc(c.lastMenu||"")}`:"初めてのご予約"}${c.phone?"　"+esc(c.phone):""}</div></span>
        <button class="btn ghost" id="custChange" style="height:36px">変更</button></div>`}
    if(M.newCust){const n=M.newCust;
      return `<div class="card" style="padding:12px;display:flex;flex-direction:column;gap:10px">
        <div class="lbl">新規顧客を登録</div>
        <div class="field"><label for="ncName">お名前（必須）</label><input class="inp" id="ncName" value="${esc(n.name)}" autocomplete="off"></div>
        <div class="field"><label for="ncKana">フリガナ</label><input class="inp" id="ncKana" value="${esc(n.kana)}" autocomplete="off"></div>
        <div class="field"><span class="lbl">性別</span><div class="seg" id="ncGender">
          ${["F","M","O"].map(g=>`<button type="button" data-g="${g}" aria-pressed="${n.gender===g}">${{F:"女性",M:"男性",O:"その他"}[g]}</button>`).join("")}</div></div>
        <div class="field"><label for="ncTel">電話番号</label><input class="inp num" id="ncTel" inputmode="tel" value="${esc(n.phone)}"></div>
        <button class="btn ghost" id="ncBack" style="height:36px">既存のお客様から探す</button></div>`}
    const q=M.q.trim().toLowerCase();
    const hits=q?Object.values(S.customers).filter(c=>[c.name,c.kana,c.phone].some(v=>(v||"").toLowerCase().includes(q))).slice(0,6):[];
    return `<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
      <input class="inp" id="bkQ" placeholder="名前・フリガナ・電話で検索" value="${esc(M.q)}" autocomplete="off"></div>
      ${q?`<div class="card results">${hits.map(c=>`<button class="res" data-pick="${esc(c.id)}"><span class="gbadge ${gClass[c.gender]||"o"}">${gLabel[c.gender]||"他"}</span>
        <span class="grow"><b>${esc(c.name)}</b> <span class="sub">${esc(c.kana||"")}</span><div class="sub">${c.lastVisit?"前回 "+dShort(c.lastVisit):"来店記録なし"}</div></span></button>`).join("")||`<p class="note" style="padding:10px 12px;margin:0">見つかりません</p>`}</div>`:""}
      <button class="btn" id="ncOpen">＋ 新規顧客として登録${q?`（${esc(M.q)}）`:""}</button>`;
  }
  function timeOpts(){let o="";const last=Math.max(open,close-15);
    const set=new Set();for(let m=open;m<=last;m+=15)set.add(m);set.add(M.start);
    [...set].sort((a,b)=>a-b).forEach(m=>o+=`<option value="${m}" ${m===M.start?"selected":""}>${fmtT(m)}</option>`);return o}

  function paint(){
    body.innerHTML=`
      <div class="field"><span class="lbl">お客様</span><div id="custArea" style="display:flex;flex-direction:column;gap:8px">${custBlock()}</div></div>
      <div class="row2">
        <div class="field"><label for="bkDate">日付</label><input type="date" class="inp num" id="bkDate" value="${M.date}"></div>
        <div class="field"><label for="bkStart">開始（15分単位）</label><select class="inp num" id="bkStart">${timeOpts()}</select></div>
      </div>
      <div class="field"><span class="lbl">メニュー（複数選択できます）</span>
        <div class="card menus">${allMenus().map(m=>`<label class="mrow"><input type="checkbox" data-mid="${esc(m.id)}" ${M.menuIds.has(m.id)?"checked":""}><span class="grow">${esc(m.name)}</span><span class="mins num">${m.min}分</span></label>`).join("")}</div></div>
      <div class="field"><span class="lbl">時間の調整</span>
        <div class="seg" id="adj">${[-10,-5,0,5,10].map(v=>`<button type="button" data-a="${v}" aria-pressed="${M.adjust===v}" class="num">${v>0?"+"+v:v===0?"±0":v}</button>`).join("")}</div></div>
      <div id="calcArea"></div>
      <div class="field"><label for="bkPrice">金額</label><div class="yen"><span>¥</span><input class="inp num" id="bkPrice" inputmode="numeric" value="${esc(M.price)}" placeholder="0"></div></div>
      <div class="field"><label for="bkMemo">メモ</label><textarea class="inp" id="bkMemo" placeholder="例：前回より明るめ希望">${esc(M.memo)}</textarea></div>
      <p class="err" id="bkErr" hidden></p>`;
    paintCalc();
  }
  function paintCalc(){const a=body.querySelector("#calcArea");if(!a)return;
    const d=dur(),end=M.start+d;
    let warn="";
    if(d>0&&M.others){const ov=M.others.filter(b=>b.start<end&&b.start+bookingDur(b)>M.start);
      if(ov.length)warn=`<div class="warn">${ov.map(b=>`${fmtT(b.start)}〜 ${esc(custName(b))} 様`).join("、")} の予約と重なっています（このまま保存もできます）</div>`}
    if(d>0&&end>close)warn+=`<div class="warn">営業時間（${st.close}）を過ぎます</div>`;
    a.innerHTML=`<div class="calc">${d>0?`合計 <b class="num">${d}分</b><span>・終了</span><b class="num">${fmtT(end)}</b>${M.adjust?`<span class="num">（調整 ${M.adjust>0?"+":""}${M.adjust}分）</span>`:""}`:"メニューを選ぶと終了時刻が出ます"}</div>${warn?`<div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">${warn}</div>`:""}`}
  function repaintCust(){sheet.querySelector("#custArea").innerHTML=custBlock()}

  body.addEventListener("input",e=>{const t=e.target;
    if(t.id==="bkQ"){M.q=t.value;repaintCust();const i=sheet.querySelector("#bkQ");i.focus();i.setSelectionRange(i.value.length,i.value.length)}
    else if(t.id==="ncName")M.newCust.name=t.value; else if(t.id==="ncKana")M.newCust.kana=t.value; else if(t.id==="ncTel")M.newCust.phone=t.value;
    else if(t.id==="bkPrice"){t.value=t.value.replace(/[^\d]/g,"");M.price=t.value} else if(t.id==="bkMemo")M.memo=t.value;});
  body.addEventListener("change",e=>{const t=e.target;
    if(t.dataset.mid){t.checked?M.menuIds.add(t.dataset.mid):M.menuIds.delete(t.dataset.mid);paintCalc()}
    else if(t.id==="bkStart"){M.start=Number(t.value);paintCalc()}
    else if(t.id==="bkDate"&&t.value){M.date=t.value;M.others=null;paintCalc();loadOthers()}});
  body.addEventListener("click",e=>{const t=e.target.closest("button,[data-pick]");if(!t)return;
    if(t.dataset.a!=null){M.adjust=Number(t.dataset.a);body.querySelectorAll("#adj button").forEach(b=>b.setAttribute("aria-pressed",String(b===t)));paintCalc()}
    else if(t.dataset.pick){M.customerId=t.dataset.pick;M.q="";repaintCust()}
    else if(t.id==="custChange"){M.customerId=null;repaintCust()}
    else if(t.id==="ncOpen"){const q=M.q.trim();M.newCust={name:/^[\d-]+$/.test(q)?"":q,kana:"",gender:"F",phone:/^[\d-]+$/.test(q)?q:""};repaintCust();sheet.querySelector("#ncName").focus()}
    else if(t.id==="ncBack"){M.newCust=null;repaintCust()}
    else if(t.dataset.g){M.newCust.gender=t.dataset.g;sheet.querySelectorAll("#ncGender button").forEach(b=>b.setAttribute("aria-pressed",String(b===t)))}
  });
  sheet.querySelector("#bkClose").onclick=closeSheet;sheet.querySelector("#bkCancel").onclick=closeSheet;
  const del=sheet.querySelector("#bkDel");
  if(del)del.onclick=async()=>{if(!M.armed){M.armed=true;del.classList.add("armed");del.textContent="本当に削除";return}
    const c=S.customers[existing.customerId];
    if(await removeBooking(existing.id)){
      if(c&&c.firstBookingId===existing.id){const nc={...c};delete nc.firstBookingId;await putCustomer(nc)}
      closeSheet();toast("予約を削除しました")}};
  sheet.querySelector("#bkSave").onclick=async()=>{
    const err=sheet.querySelector("#bkErr");const fail=m=>{err.textContent=m;err.hidden=false;err.scrollIntoView({block:"nearest"})};
    let cust=M.customerId?S.customers[M.customerId]:null;let created=false;
    if(!cust){if(M.newCust&&M.newCust.name.trim()){cust={id:uid(),name:M.newCust.name.trim(),kana:M.newCust.kana.trim(),gender:M.newCust.gender,phone:M.newCust.phone.trim(),memo:"",createdAt:Date.now()};created=true}
      else return fail(M.newCust?"お名前を入力してください":"お客様を選ぶか、新規顧客として登録してください")}
    if(!chosen().length)return fail("メニューを1つ以上選んでください");
    const menus=chosen().map(m=>({id:m.id,name:m.name,min:m.min}));
    const b={id:M.id,date:M.date,start:M.start,menus,adjust:M.adjust,price:Number(M.price)||0,memo:M.memo.trim(),
      customerId:cust.id,customerName:cust.name,gender:cust.gender,createdAt:existing?existing.createdAt||Date.now():Date.now(),updatedAt:Date.now()};
    const nc={...cust};
    if(created||!nc.firstBookingId)nc.firstBookingId=b.id;
    b.isNewAtSave=nc.firstBookingId===b.id;
    if(!nc.lastVisit||b.date>=nc.lastVisit){nc.lastVisit=b.date;nc.lastMenu=menus.map(m=>m.name).join("＋")}
    if(existing&&existing.customerId!==cust.id){const old=S.customers[existing.customerId];
      if(old&&old.firstBookingId===existing.id){const o={...old};delete o.firstBookingId;await putCustomer(o)}}
    if(!(await putCustomer(nc)))return;
    if(!(await putBooking(b)))return;
    closeSheet();toast(existing?"予約を更新しました":"予約を保存しました");
    if(b.date!==S.date&&!existing)setDate(b.date);
  };
  paint();loadOthers();
}

/* ---------- customer sheet ---------- */
async function openCustomer(cid){
  const isNewC=!cid;
  const c=isNewC?{id:uid(),name:"",kana:"",gender:"F",phone:"",memo:"",createdAt:Date.now()}:{...S.customers[cid]};
  if(!c)return;let armed=false;
  const sheet=openSheet(`
    <div class="sheet-h"><h2>${isNewC?"新規顧客":esc(c.name)+" 様"}</h2><button class="iconbtn" id="cClose" aria-label="閉じる">×</button></div>
    <div class="sheet-b">
      ${isNewC?"":`<div class="stats" id="cStats"><span>来店<b class="num">–</b>回</span><span>累計<b class="num">–</b></span></div>`}
      <div class="field"><label for="cName">お名前</label><input class="inp" id="cName" value="${esc(c.name)}"></div>
      <div class="field"><label for="cKana">フリガナ</label><input class="inp" id="cKana" value="${esc(c.kana||"")}"></div>
      <div class="field"><span class="lbl">性別</span><div class="seg" id="cGender">${["F","M","O"].map(g=>`<button type="button" data-g="${g}" aria-pressed="${c.gender===g}">${{F:"女性",M:"男性",O:"その他"}[g]}</button>`).join("")}</div></div>
      <div class="field"><label for="cTel">電話番号</label><input class="inp num" id="cTel" inputmode="tel" value="${esc(c.phone||"")}"></div>
      <div class="field"><label for="cMemo">カルテメモ</label><textarea class="inp" id="cMemo" placeholder="髪質、好み、注意点など">${esc(c.memo||"")}</textarea></div>
      ${isNewC?"":`<div class="field"><span class="lbl">来店履歴</span><div class="card hist" id="cHist"><p class="note" style="padding:12px;margin:0">読み込み中…</p></div></div>
      <button class="btn" id="cBook">このお客様で予約を入れる</button>`}
      <p class="err" id="cErr" hidden></p>
    </div>
    <div class="sheet-f">${isNewC?"":`<button class="btn danger" id="cDel">削除</button>`}<button class="btn" id="cCancel">閉じる</button><button class="btn pri" id="cSave">保存</button></div>`);
  sheet.querySelector("#cClose").onclick=closeSheet;sheet.querySelector("#cCancel").onclick=closeSheet;
  sheet.querySelectorAll("#cGender button").forEach(b=>b.onclick=()=>{c.gender=b.dataset.g;sheet.querySelectorAll("#cGender button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});
  sheet.querySelector("#cSave").onclick=async()=>{
    c.name=sheet.querySelector("#cName").value.trim();c.kana=sheet.querySelector("#cKana").value.trim();
    c.phone=sheet.querySelector("#cTel").value.trim();c.memo=sheet.querySelector("#cMemo").value.trim();
    if(!c.name){const e=sheet.querySelector("#cErr");e.textContent="お名前を入力してください";e.hidden=false;return}
    if(await putCustomer(c)){closeSheet();toast("顧客情報を保存しました");if(S.mode==="db")renderAll()}};
  if(!isNewC){
    const del=sheet.querySelector("#cDel");
    del.onclick=async()=>{if(!armed){armed=true;del.classList.add("armed");del.textContent="本当に削除";return}
      if(await removeCustomer(c.id)){closeSheet();toast("顧客を削除しました（過去の予約は残ります）")}};
    sheet.querySelector("#cBook").onclick=()=>{closeSheet();setTab("schedule");openBooking(null,{start:parseT(S.settings.open),customerId:c.id})};
    const h=await historyOf(c.id);
    const el=sheet.querySelector("#cHist");if(!el)return;
    el.innerHTML=h.length?h.map(b=>`<div class="hrow"><span class="num">${dShort(b.date)}</span><span class="grow">${esc((b.menus||[]).map(m=>m.name).join("＋"))}${b.id===c.firstBookingId?'<span class="tag" style="background:var(--n-bg);color:var(--n-fg)">初回</span>':""}${b.memo?`<div class="memo">${esc(b.memo)}</div>`:""}</span><span class="num">${yen(b.price)}</span></div>`).join("")
      :`<p class="note" style="padding:12px;margin:0">来店履歴はまだありません</p>`;
    const st=sheet.querySelector("#cStats");
    if(st)st.innerHTML=`<span>来店<b class="num">${h.length}</b>回</span><span>累計<b class="num">${yen(h.reduce((s,b)=>s+(Number(b.price)||0),0))}</b></span>${h[0]?`<span>最終<b class="num">${dShort(h[0].date)}</b></span>`:""}`;
  }
}

/* ---------- customers view events ---------- */
$("#vCustomers").addEventListener("input",e=>{if(e.target.id==="custSearch"){S.custQuery=e.target.value;renderCustomers();const i=$("#custSearch");i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
$("#vCustomers").addEventListener("click",e=>{const r=e.target.closest("[data-cid]");if(r)return openCustomer(r.dataset.cid);if(e.target.id==="custAdd")openCustomer(null)});

/* ---------- settings events ---------- */
$("#vSettings").addEventListener("input",e=>{const t=e.target;if(t.dataset.k==="name")draftSettings.menus[Number(t.dataset.i)].name=t.value});
$("#vSettings").addEventListener("change",e=>{const t=e.target;if(t.id==="stOpen")draftSettings.open=t.value;if(t.id==="stClose")draftSettings.close=t.value});
$("#vSettings").addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.d){const m=draftSettings.menus[Number(t.dataset.i)];m.min=Math.min(480,Math.max(5,m.min+Number(t.dataset.d)));renderSettings()}
  else if(t.dataset.del!=null){draftSettings.menus.splice(Number(t.dataset.del),1);renderSettings()}
  else if(t.id==="menuAdd"){draftSettings.menus.push({id:"m"+uid().slice(0,8),name:"",min:60});renderSettings();const ins=document.querySelectorAll("#menuList .inp");ins[ins.length-1].focus()}
  else if(t.id==="setSave"){
    const st=structuredClone(draftSettings);st.menus=st.menus.filter(m=>m.name.trim()).map(m=>({...m,name:m.name.trim()}));
    if(parseT(st.close)<=parseT(st.open)){toast("閉店時間は開店時間より後にしてください");return}
    if(await putSettings(st)){S.settings=st;draftSettings=null;toast("設定を保存しました");renderSettings()}}
});

/* ---------- boot ---------- */
renderAll();
setInterval(()=>{if(S.tab==="schedule"&&S.date===todayStr())renderSchedule()},60000);
(async()=>{
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){S.mode="local";loadLocal();renderAll();return}
  S.mode="db";S.db=db;
  db.doc("settings/main").onSnapshot(s=>{if(s.exists){const d=s.data();S.settings={open:d.open||"10:00",close:d.close||"20:00",menus:Array.isArray(d.menus)?d.menus.map(m=>({...m})):[]}}renderAll()},()=>{});
  db.collection("customers").onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S.customers=o;renderAll()},()=>{});
  subscribeDay();renderAll();
})();
})();
</script>

</body></html>
