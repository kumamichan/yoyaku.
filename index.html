      const k=same.indexOf(i),j=same[t.dataset.up!=null?k-1:k+1];if(j==null)return;
      const next=clone(list);[next[i],next[j]]=[next[j],next[i]];

    if(t.id==="mmDone")return closeSheet();

    if(t.id==="meDel"){if(!armed){armed=true;t.classList.add("armed");t.textContent="本当に削除";return}

    if(t.id==="bkApply"){
      const next=list.map(m=>bulkHit(m)?Object.assign({},m,{price:bulkNew(m)}):m);
      saving=true;t.disabled=true;t.textContent="保存中…";const r=await saveMenus(next);saving=false;
      if(r){list=r;bulk.pct="";view="list";paint();toast("料金を変更しました")}else{t.disabled=false;t.textContent="この料金で保存"}}
  });
  paint();
}

/* ---------- calendar sheet ---------- */
function openCalendar(){
  let cur=S.date.slice(0,7),token=0;
  const sheet=openSheet(`<div class="sheet-h"><h2>日付を選ぶ</h2><button class="iconbtn" id="calClose" aria-label="閉じる">×</button></div><div class="sheet-b" id="calBody"></div>`);
  sheet.querySelector("#calClose").onclick=closeSheet;
  const body=sheet.querySelector("#calBody");
  function gridRange(){const first=cur+"-01";const start=addDays(first,-dow(first));const last=lastDay(cur);const cells=Math.ceil((dow(first)+Number(last.slice(8)))/7)*7;return {start,cells,end:addDays(start,cells-1)}}
  function grid(byDay){
    const g=gridRange(),today=todayStr();
    let h=WD.map((w,i)=>`<div class="wd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("");
    for(let i=0;i<g.cells;i++){const ds=addDays(g.start,i);const out=ds.slice(0,7)!==cur;const list=byDay?(byDay[ds]||[]):[];const w=dow(ds);
      const n=list.filter(b=>b.kind!=="block").length;
      h+=`<button class="day ${out?"out":""} ${ds===today?"today":""} ${ds===S.date?"sel":""} ${w===0?"sun":w===6?"sat":""} ${isClosedDay(ds)?"closed":""}" data-d="${ds}" aria-label="${dLabel(ds)} 予約${n}件">
        <span class="dn">${Number(ds.slice(8))}</span>${n?`<span class="cnt num">${n}件</span>`:""}${list.length?`<span class="dots">${list.slice(0,6).map(b=>`<i class="${colorOf(b)}"></i>`).join("")}</span>`:""}</button>`}
    return h;
  }
  async function paint(){
    const my=++token;
    body.innerHTML=`<div class="monthbar"><button class="iconbtn" id="calPrev" aria-label="前の月">‹</button><span class="m">${ymLabel(cur)}</span><button class="iconbtn" id="calNext" aria-label="次の月">›</button></div>
      <div class="cal">${grid(null)}</div>
      <div class="calfoot"><span class="legend" style="margin:0;font-size:12px;color:var(--muted)"><span><i class="dot f"></i>女性</span><span><i class="dot m"></i>男性</span><span><i class="dot n"></i>新規</span></span><button class="btn sm" id="calToday">今日に戻る</button></div>`;
    body.querySelector("#calPrev").onclick=()=>{cur=ymShift(cur,-1);paint()};
    body.querySelector("#calNext").onclick=()=>{cur=ymShift(cur,1);paint()};
    body.querySelector("#calToday").onclick=()=>{closeSheet();setDate(todayStr())};
    const g=gridRange();const list=await rangeBookings(g.start,g.end);
    if(my!==token||!list)return;
    const byDay={};list.forEach(b=>{(byDay[b.date]=byDay[b.date]||[]).push(b)});Object.values(byDay).forEach(a=>a.sort((p,q)=>p.start-q.start));
    const c=body.querySelector(".cal");if(c)c.innerHTML=grid(byDay);
  }
  body.addEventListener("click",e=>{const t=e.target.closest(".day");if(!t)return;closeSheet();setDate(t.dataset.d)});
  paint();
}

/* ---------- analysis sheet ---------- */
function statsOf(list){const o={n:0,sales:0,newN:0,newSales:0,exN:0,exSales:0,webN:0,webSales:0,storeN:0,storeSales:0};
  list.filter(b=>b.kind!=="block").forEach(b=>{const p=Number(b.price)||0;o.n++;o.sales+=p;if(b.isNew){o.newN++;o.newSales+=p}else{o.exN++;o.exSales+=p}if(b.source==="web"){o.webN++;o.webSales+=p}else{o.storeN++;o.storeSales+=p}});return o}
const avg=(s,n)=>n?Math.round(s/n):0;
const diffTxt=(cur,prev)=>{if(!prev)return "前月 データなし";const r=Math.round((cur-prev)/prev*100);return `前月比 <span class="${r>=0?"up":"down"}">${r>=0?"+":""}${r}%</span>`};
function openAnalysis(ym){
  const sheet=openSheet(`<div class="sheet-h"><h2>売上分析</h2><button class="iconbtn" id="anClose" aria-label="閉じる">×</button></div><div class="sheet-b" id="anBody"></div>`);
  sheet.querySelector("#anClose").onclick=closeSheet;
  const body=sheet.querySelector("#anBody");let cur=ym,token=0;
  const nav=()=>`<div class="monthbar"><button class="iconbtn" id="anPrev" aria-label="前の月">‹</button><span class="m">${ymLabel(cur)}</span><button class="iconbtn" id="anNext" aria-label="次の月">›</button></div>`;
  const bind=()=>{body.querySelector("#anPrev").onclick=()=>{cur=ymShift(cur,-1);paint()};body.querySelector("#anNext").onclick=()=>{cur=ymShift(cur,1);paint()}};
  const row=(label,dot,n,s)=>`<tr><td><span class="chip">${dot?`<i class="dot ${dot}"></i>`:""}${label}</span></td><td class="num">${n}人</td><td class="num">${yen(s)}</td><td class="num">${yen(avg(s,n))}</td></tr>`;
  async function paint(){
    const my=++token;body.innerHTML=nav()+`<p class="note" style="text-align:center">集計中…</p>`;bind();
    const prev=ymShift(cur,-1);
    const all=await rangeBookings(prev+"-01",lastDay(cur));
    if(my!==token)return;
    if(!all){body.querySelector(".note").textContent="集計できませんでした";return}
    const list=all.filter(b=>b.date.startsWith(cur)),plist=all.filter(b=>b.date.startsWith(prev));
    const s=statsOf(list),p=statsOf(plist);
    const days={};list.filter(b=>b.kind!=="block").forEach(b=>{(days[b.date]=days[b.date]||[]).push(b)});
    const dayRows=Object.keys(days).sort().map(d=>{const x=statsOf(days[d]);return `<tr><td>${dLabel(d)}</td><td class="num">${x.n}</td><td class="num">${x.newN}</td><td class="num">${x.webN}</td><td class="num">${yen(x.sales)}</td></tr>`}).join("");
    body.innerHTML=nav()+`
      <div class="kpis">
        <div class="card kpi"><span class="k">売上合計</span><span class="v">${yen(s.sales)}</span><span class="s">${diffTxt(s.sales,p.sales)}</span></div>
        <div class="card kpi"><span class="k">客数</span><span class="v">${s.n}<small style="font-size:14px">人</small></span><span class="s">${diffTxt(s.n,p.n)}</span></div>
        <div class="card kpi"><span class="k">客単価</span><span class="v">${yen(avg(s.sales,s.n))}</span><span class="s">前月 ${yen(avg(p.sales,p.n))}</span></div>
        <div class="card kpi"><span class="k">新規比率</span><span class="v">${s.n?Math.round(s.newN/s.n*100):0}%</span><span class="s">新規 ${s.newN}人 ／ 既存 ${s.exN}人</span></div>
      </div>
      <div class="field"><span class="lbl">新規・既存の内訳</span><div class="card tbl-wrap"><table class="tbl">
        <thead><tr><th>区分</th><th>客数</th><th>売上</th><th>客単価</th></tr></thead>
        <tbody>${row("新規","n",s.newN,s.newSales)}${row("既存","f",s.exN,s.exSales)}</tbody>
        <tfoot><tr><td>合計</td><td class="num">${s.n}人</td><td class="num">${yen(s.sales)}</td><td class="num">${yen(avg(s.sales,s.n))}</td></tr></tfoot></table></div></div>
      <div class="field"><span class="lbl">予約の経路</span><div class="card tbl-wrap"><table class="tbl">
        <thead><tr><th>経路</th><th>客数</th><th>売上</th><th>客単価</th></tr></thead>
        <tbody>${row("WEB予約","",s.webN,s.webSales)}${row("店頭・電話","",s.storeN,s.storeSales)}</tbody></table></div></div>
      <div class="field"><span class="lbl">日別</span><div class="card tbl-wrap">${dayRows?`<table class="tbl"><thead><tr><th>日付</th><th>客数</th><th>新規</th><th>WEB</th><th>売上</th></tr></thead><tbody>${dayRows}</tbody></table>`:`<p class="note" style="padding:12px">この月の予約はまだありません</p>`}</div></div>
      <p class="note">予約に入力した金額で集計しています。客数は来店（予約）件数で、キャンセルと受付停止は含みません。新規はそのお客様の初回の予約です。</p>`;
    bind();
  }
  paint();
}

/* ---------- boot ---------- */
renderAll();
setInterval(()=>{if(S.tab==="schedule"&&S.date===todayStr()&&!document.hidden)renderSchedule()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.key)loadDay()});
(async()=>{
  if(API.demo)$("#demoBar").hidden=false;
  if(!S.key){showLogin("");return}
  if(!(await loadSettings()))return;
  renderAll();loadDay();loadCustomers();
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
